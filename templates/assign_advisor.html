{% extends "base.html" %}

{% block title %}Assign Advisor{% endblock %}

{% block content %}
<section class="vh-100">
  <div class="container py-5 h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col-12 col-md-8 col-lg-6 col-xl-5">
        <div class="card bg-dark text-white" style="border-radius: 1rem;">
          <div class="card-body p-5 text-center">
            <div class="mb-md-2 mt-md-2 pb-5">
              <h2 class="fw-bold mb-4 text-uppercase">Assign Advisor</h2>
              <h4 class="mb-4">{{ studentdata['f_name'] }} {{ studentdata['l_name'] }}</h4>
              <form method="POST">
                <div data-mdb-input-init class="form-outline form-white mb-4">
                  <label for="advisor" class="form-label">New Advisor:</label>
                  <select name="advisor" id="advisor" class="form-control form-control-lg" required>
                    {% for advisor in faculty_advisors %}
                      <option value="{{ advisor['UID'] }}">{{ advisor['firstName'] }} {{ advisor['lastName'] }}</option>
                    {% endfor %}
                  </select>
                </div>

                <div class="form-group mt-4">
                  <button data-mdb-button-init data-mdb-ripple-init class="btn btn-outline-light btn-lg px-5 me-2" type="submit">Assign</button>
                  <a href="{{ url_for('student_information', student_UID=student_UID) }}" class="btn btn-outline-light btn-lg px-5">Cancel</a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
