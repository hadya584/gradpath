<!DOCTYPE html>
<html>
<head>
    <title>Instructor Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body>
    <div class="container">
        
        <h1>Instructor Dashboard</h1>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div>{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <div class="nav-buttons">
            {% if session['role'] == 'Faculty' %}
                <a href="{{ url_for('instructor_schedule') }}" class="nav-button">View My Courses</a>
                <a href="{{ url_for('instructor_courses') }}" class="nav-button">View Enrolled Students</a>
                <a href="{{ url_for('instructor_grading') }}" class="nav-button">Enter Final Grades</a> 
                <a href="{{ url_for('logout') }}" class="nav-button">Logout</a>
            {% endif %}
        </div>
    </div>
</body>
</html>
