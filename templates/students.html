<script>
    function filterStudents() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const students = document.querySelectorAll("a.student");

        students.forEach(student => {
            const studentText = student.innerText.toLowerCase();
            student.style.display = studentText.includes(query) ? "" : "none";
        });
    }
</script>

<html>
    <head>
        <link href = "/static/styles/students.css" rel = "stylesheet" type = "text/css" />

    </head>
    <h1>Students</h1>
    <div class="search-box">
        <input type="text" id="searchInput" onkeyup="filterStudents()" placeholder="Search students">
    </div>
    <br><br>
    <div class = sketchy>
    {% if students %}
        {% for student in students %}
            <a href="{{ url_for('student_information', student_UID = student['UID']) }}" class = student> {{student['firstName']}} {{student['lastName']}} </p>
        {% endfor %}
    {% else %}
        <p>No students.</p>
    {% endif %}
</div>
    <br><br>
    <a href="{{ url_for('alumni_dashboard') if session['role'] == 'Alumni' else url_for('gs_dashboard') if session['role'] == 'GS' else url_for('instructor_dashboard') if session['role'] == 'Faculty' else url_for('admin_dashboard') if session['role'] == 'Admin'}}" class="nav-button">← Back to Dashboard</a>
</html>
