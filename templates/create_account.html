<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='account.css') }}">
</head>
<body>
    <div class="container">
        <h1>Create Account</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="{{ 'flash-message' if category == 'error' else 'success-message' }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="post">
            <input type="text" name="first_name" placeholder="First Name" required>
            <input type="text" name="last_name" placeholder="Last Name" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>

            <label for="role_type">Role:</label>
            <select name="role_type" required>
                <option value="Student">Student</option>
                <option value="Instructor">Instructor</option>
                <option value="GradSecretary">GradSecretary</option>
                <option value="Admin">Admin</option>
            </select>

            <div id="student-extra" style="display: none;">
                <input type="text" name="address" placeholder="Address">
                <select name="program">
                    <option value="Masters">Masters</option>
                    <option value="PhD">PhD</option>
                </select>
            </div>

            <button type="submit">Create Account</button>
        </form>
    </div>

    <script>
        document.querySelector('select[name="role_type"]').addEventListener('change', function() {
            document.getElementById('student-extra').style.display = this.value === 'Student' ? 'block' : 'none';
        });
    </script>
</body>
</html>
