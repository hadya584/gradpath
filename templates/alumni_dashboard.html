{% extends "base.html" %}

{% block title %}Alumni Dashboard{% endblock %}

{% block content %}
<section class="vh-100">
  <div class="container py-5 h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col-12 col-md-8 col-lg-6 col-xl-5">
        <div class="card bg-dark text-white" style="border-radius: 1rem;">
          <div class="card-body p-5 text-center">
            <div class="mb-md-2 mt-md-2 pb-5">
                <h2 class="fw-bold mb-4 text-uppercase">Alumni Dashboard</h2>
                <div class="d-flex flex-column align-items-center ">
                  
                  {% if session['role'] == 'Alumni' %}
                    <a href="{{ url_for('view_transcript') }}" class="btn btn-outline-light btn-lg w-75 mb-2">View Transcript</a>
                    <a href="{{ url_for('personal_info') }}" class="btn btn-outline-light btn-lg w-75 mb-2">Personal Info</a> 
                    <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-lg w-75 mb-2">Logout</a>
                  {% endif %}
                </div>
                {% if error %}
                  <div class="alert alert-danger mt-3">{{ error }}</div>
                {% endif %}
              </div>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
