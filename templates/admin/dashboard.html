{% extends "base.html" %}

{% block title %}Admin Dashboard{% endblock %}

{% block content %}
<section class="vh-100">
  <div class="container py-5 h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col-12 col-md-10 col-lg-8 col-xl-6">
        <div class="card bg-dark text-white" style="border-radius: 1rem;">
          <div class="card-body p-5 text-center">
            <h2 class="fw-bold mb-4 text-uppercase">Admin Dashboard</h2>
            <div class="d-grid gap-3">
              <a href="{{ url_for('create_user') }}" class="btn btn-outline-light btn-lg">Create Users</a>
              <a href="{{ url_for('assign_instructor') }}" class="btn btn-outline-light btn-lg">Assign Instructors to Courses</a>
              <a href="{{ url_for('add_course') }}" class="btn btn-outline-light btn-lg">Add Courses</a>
              <a href="{{ url_for('add_schedule') }}" class="btn btn-outline-light btn-lg">Add Course Offerings (Schedule)</a>
              <a href="{{ url_for('add_prerequisite') }}" class="btn btn-outline-light btn-lg">Add Course Prerequisites</a>
              <a href="{{ url_for('admin_manage') }}" class="btn btn-outline-light btn-lg">View / Edit Information</a>
              <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-lg">Logout</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
