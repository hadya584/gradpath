<html>
<head>
    <link href = "/static/styles/auth.css" rel = "stylesheet" type = "text/css" />
    <title> Login </title>
    <style>
      
    </style>
</head>
<body>
    <h1>Login Page</h1>

<div class = sketchy>
    {% if is_suspended %}
        <p class="error">Student is Suspended!</p>
    {% endif %}
    {% if error %}
        <p class="error">Incorrect email or password!</p>
    {% endif %}
 <form action="/" method="POST">
    <label for="email">Email:</label>
    <input type="text" id="email" name="email" required><br><br>
    
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required><br><br>


<input type="submit" class = buttonsketch value="Login">


<a href="{{ url_for('signup')}}"  class = buttonsketch>Sign up</a>


</div>
</body>
</html>
